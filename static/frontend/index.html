<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ServiApp</title>

    <link rel="stylesheet" href="/static/frontend/styles.css">
    <script defer src="/static/frontend/app.js"></script>
</head>
<body>

<div class="container">

    <h1>ServiApp</h1>

    <!-- AUTH -->
    <div id="auth">
        <h2>Login</h2>
        <input id="login-user" placeholder="Usuario">
        <input id="login-pass" type="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>

    <!-- PANEL -->
    <div id="panel" class="hidden">

        <button onclick="logout()">Cerrar sesión</button>

        <h2>Publicar servicio</h2>
        <input id="title" placeholder="Título">
        <textarea id="desc"></textarea>
        <select id="category"></select>
        <select id="city">
            <option>Bogotá</option>
            <option>Funza</option>
            <option>Mosquera</option>
        </select>
        <button onclick="createService()">Publicar</button>

        <h2>Servicios</h2>

        <!-- FILTROS -->
        <select id="filter-city">
            <option value="">Todas</option>
            <option>Bogotá</option>
            <option>Funza</option>
            <option>Mosquera</option>
        </select>

        <button onclick="loadServices()">Filtrar</button>

        <div id="services"></div>

    </div>

</div>

</body>
</html>
