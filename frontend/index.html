<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Servicios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin-bottom: 30px; border: 1px solid #ccc; padding: 20px; }
        form { margin-bottom: 20px; }
        input, button { margin: 5px; padding: 8px; }
        #services, #requests { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Plataforma de Servicios Bajo Demanda</h1>

    <div class="section" id="auth">
        <h2>Autenticación</h2>
        <div id="register">
            <h3>Registro</h3>
            <input type="text" id="reg-username" placeholder="Usuario">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Contraseña">
            <input type="text" id="reg-firstname" placeholder="Nombre">
            <input type="text" id="reg-lastname" placeholder="Apellido">
            <button onclick="register()">Registrar</button>
        </div>
        <div id="login">
            <h3>Inicio de Sesión</h3>
            <input type="text" id="login-username" placeholder="Usuario">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button onclick="login()">Iniciar Sesión</button>
        </div>
        <button onclick="logout()">Cerrar Sesión</button>
    </div>

    <div class="section" id="profile" style="display:none;">
        <h2>Perfil</h2>
        <p id="profile-info"></p>
        <input type="text" id="profile-phone" placeholder="Teléfono">
        <input type="number" step="any" id="profile-lat" placeholder="Latitud">
        <input type="number" step="any" id="profile-lng" placeholder="Longitud">
        <textarea id="profile-bio" placeholder="Biografía"></textarea>
        <label><input type="checkbox" id="profile-provider"> Soy Proveedor</label>
        <button onclick="updateProfile()">Actualizar Perfil</button>
    </div>

    <div class="section" id="categories">
        <h2>Categorías de Servicios</h2>
        <div id="categories-list"></div>
    </div>

    <div class="section" id="services" style="display:none;">
        <h2>Servicios</h2>
        <button onclick="loadServices()">Cargar Servicios</button>
        <div id="services-list"></div>
        <h3>Crear Servicio</h3>
        <select id="service-category"></select>
        <input type="text" id="service-title" placeholder="Título">
        <textarea id="service-description" placeholder="Descripción"></textarea>
        <input type="number" step="0.01" id="service-price" placeholder="Precio">
        <button onclick="createService()">Crear Servicio</button>
    </div>

    <div class="section" id="requests" style="display:none;">
        <h2>Solicitudes</h2>
        <button onclick="loadRequests()">Cargar Solicitudes</button>
        <div id="requests-list"></div>
        <h3>Crear Solicitud</h3>
        <select id="request-category"></select>
        <input type="text" id="request-title" placeholder="Título">
        <textarea id="request-description" placeholder="Descripción"></textarea>
        <input type="number" step="any" id="request-lat" placeholder="Latitud">
        <input type="number" step="any" id="request-lng" placeholder="Longitud">
        <button onclick="createRequest()">Crear Solicitud</button>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let token = localStorage.getItem('token');

        if (token) {
            showLoggedIn();
        }

        function showLoggedIn() {
            document.getElementById('profile').style.display = 'block';
            document.getElementById('services').style.display = 'block';
            document.getElementById('requests').style.display = 'block';
            loadProfile();
            loadCategories();
        }

        function register() {
            const data = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                first_name: document.getElementById('reg-firstname').value,
                last_name: document.getElementById('reg-lastname').value,
            };
            fetch(`${API_BASE}/users/register/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(data => alert('Usuario registrado'));
        }

        function login() {
            const data = {
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value,
            };
            fetch(`${API_BASE}/users/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(data => {
                if (data.access) {
                    token = data.access;
                    localStorage.setItem('token', token);
                    showLoggedIn();
                } else {
                    alert('Error en login');
                }
            });
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            document.getElementById('profile').style.display = 'none';
            document.getElementById('services').style.display = 'none';
            document.getElementById('requests').style.display = 'none';
        }

        function loadProfile() {
            fetch(`${API_BASE}/users/profile/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => res.json()).then(data => {
                document.getElementById('profile-info').innerText = JSON.stringify(data, null, 2);
                document.getElementById('profile-phone').value = data.phone || '';
                document.getElementById('profile-lat').value = data.latitude || '';
                document.getElementById('profile-lng').value = data.longitude || '';
                document.getElementById('profile-bio').value = data.bio || '';
                document.getElementById('profile-provider').checked = data.is_provider;
            });
        }

        function updateProfile() {
            const data = {
                phone: document.getElementById('profile-phone').value,
                latitude: parseFloat(document.getElementById('profile-lat').value),
                longitude: parseFloat(document.getElementById('profile-lng').value),
                bio: document.getElementById('profile-bio').value,
                is_provider: document.getElementById('profile-provider').checked,
            };
            fetch(`${API_BASE}/users/profile/`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(data => loadProfile());
        }

        function loadCategories() {
            fetch(`${API_BASE}/services/categories/`)
            .then(res => res.json()).then(data => {
                const list = document.getElementById('categories-list');
                list.innerHTML = data.map(c => `<div>${c.name}: ${c.description}</div>`).join('');
                const selects = ['service-category', 'request-category'];
                selects.forEach(id => {
                    const select = document.getElementById(id);
                    select.innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                });
            });
        }

        function loadServices() {
            fetch(`${API_BASE}/services/services/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => res.json()).then(data => {
                const list = document.getElementById('services-list');
                list.innerHTML = data.map(s => `<div>${s.title} - ${s.price} (Proveedor: ${s.provider.username})</div>`).join('');
            });
        }

        function createService() {
            const data = {
                category_id: document.getElementById('service-category').value,
                title: document.getElementById('service-title').value,
                description: document.getElementById('service-description').value,
                price: parseFloat(document.getElementById('service-price').value),
            };
            fetch(`${API_BASE}/services/services/`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(data => loadServices());
        }

        function loadRequests() {
            fetch(`${API_BASE}/requests/requests/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => res.json()).then(data => {
                const list = document.getElementById('requests-list');
                list.innerHTML = data.map(r => `<div>${r.title} - ${r.status} (Cliente: ${r.client})</div>`).join('');
            });
        }

        function createRequest() {
            const data = {
                category_id: document.getElementById('request-category').value,
                title: document.getElementById('request-title').value,
                description: document.getElementById('request-description').value,
                latitude: parseFloat(document.getElementById('request-lat').value),
                longitude: parseFloat(document.getElementById('request-lng').value),
            };
            fetch(`${API_BASE}/requests/requests/`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(data => loadRequests());
        }

        loadCategories();
    </script>
</body>
</html>
